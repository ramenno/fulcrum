services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: fulcrum-vllm
    restart: unless-stopped
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_LOGGING_LEVEL=INFO
    ports:
      - "8000:8000"
    ipc: host
    network_mode: host
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model ${MODEL_ID:-google/gemma-3-12b-it}
      --port 8000
      --tensor-parallel-size ${TENSOR_PARALLEL:-1}
      --max-model-len ${MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization 0.95
      --enable-chunked-prefill
      --enable-prefix-caching
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

